# Plain static site - no build step. Netlify publishes this folder as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
